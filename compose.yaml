# WorkEspoo production stack. On the VPS the deploy hook runs this with
#   --env-file /opt/workespoo/env/.env  (interpolation: POSTGRES_*, APP_DOMAIN)
#   ENV_FILE=/opt/workespoo/env/.env    (runtime env for web and worker)
#   APP_TAG=<short sha> GIT_COMMIT=<full sha>
#
# Memory (2 vCPU, 3.7 GiB RAM + 4 GiB swap): the limits below are ceilings, not
# reservations. A misbehaving worker is capped at 768 MB. The image build runs
# inside dockerd, outside these limits, so db, web and caddy get a negative
# oom_score_adj: if memory runs out the kernel kills the build (or the worker)
# first, not the database or the site. The speech model (`stt`) holds about
# 1.6 GB and is the first to go: it restarts in three seconds, and voice falls
# back to typing meanwhile.
name: workespoo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
  image: workespoo-app:${APP_TAG:-dev}
  env_file:
    - ${ENV_FILE:-.env}
  restart: unless-stopped
  logging: *logging
  # tini as PID 1: forwards SIGTERM to npm/node and reaps zombies.
  init: true
  # Runs as the image's non-root `node` user; it needs no capabilities.
  # Not read_only: Next.js writes .next/cache at runtime.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workespoo}
      POSTGRES_DB: ${POSTGRES_DB:-workespoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the env file}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    oom_score_adj: -800

  web:
    <<: *app
    command: ["npm", "run", "start"]
    environment:
      # Docker sets HOSTNAME to the container id; Next.js binds to it if left alone.
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # The model key allows 40 requests a minute for everything. Web and worker each pace
      # their own requests, so they split the budget: most of it goes to the process that
      # talks to people. Override in the env file with LLM_RPM_SHARE_WEB / _WORKER.
      LLM_RPM_SHARE: ${LLM_RPM_SHARE_WEB:-0.7}
      # Speech to text on our own server (the `stt` service). Unset or unreachable: the
      # browser's own speech recognition is used instead.
      STT_URL: ws://stt:6006
    networks:
      - default
      - stt
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 1536m
    oom_score_adj: -500

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    environment:
      LLM_RPM_SHARE: ${LLM_RPM_SHARE_WORKER:-0.3}
      # No live calls are made from the worker, so nothing is held back for them.
      LLM_LIVE_RESERVE_RPM: "0"
      LLM_LIVE_RESERVE_SLOTS: "0"
    mem_limit: 768m

  # Speech to text (docs/research/voice-stt.md): the web container sends a person's audio here
  # and gets text back. The audio is held in memory for the second or two it takes and dropped.
  # This container has no volume, a read-only file system, no secrets (no env file) and sits on a
  # network with no route to the internet, shared with `web` only.
  stt:
    build:
      context: ./infra/stt
    # The tag names the runtime and the model. Change it when infra/stt/Dockerfile changes.
    image: workespoo-stt:sherpa-2.0.1-parakeet-tdt-0.6b-v3-int8
    restart: unless-stopped
    logging: *logging
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - stt
    expose:
      - "6006"
    healthcheck:
      test: ["CMD", "node", "-e", "const w=new WebSocket('ws://127.0.0.1:6006');w.onopen=()=>{w.send('Done');process.exit(0)};w.onerror=()=>process.exit(1);setTimeout(()=>process.exit(1),4000)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    # The model holds about 1.6 GB. Above the ceiling the container is killed and starts again.
    mem_limit: 2200m
    oom_score_adj: 300
    # When everything is busy at once, the site and the database come first.
    cpu_shares: 512

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    # Runs as root inside the container (owns /data and /config), but with
    # only the one capability it needs to bind 80 and 443.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    oom_score_adj: -500
    # The ONLY published ports on the host. Docker bypasses ufw for published
    # ports, so never add `ports:` to db, web or worker.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy-data holds the ACME account and certificates. It survives
      # `up`/redeploys; never `docker compose down -v` (see infra/README.md).
      - caddy-data:/data
      - caddy-config:/config

networks:
  default: {}
  # No gateway to the outside: nothing on this network can reach the internet.
  stt:
    internal: true

volumes:
  db-data:
  caddy-data:
  caddy-config:
