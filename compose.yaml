# WorkEspoo production stack. On the VPS the deploy hook runs this with
#   --env-file /opt/workespoo/env/.env  (interpolation: POSTGRES_*, APP_DOMAIN)
#   ENV_FILE=/opt/workespoo/env/.env    (runtime env for web and worker)
#   APP_TAG=<short sha> GIT_COMMIT=<full sha>
#
# Memory (2 vCPU, 3.7 GiB RAM + 4 GiB swap): the limits below are ceilings, not
# reservations. A misbehaving worker is capped at 768 MB. The image build runs
# inside dockerd, outside these limits, so db, web and caddy get a negative
# oom_score_adj: if memory runs out the kernel kills the build (or the worker)
# first, not the database or the site.
name: workespoo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
  image: workespoo-app:${APP_TAG:-dev}
  env_file:
    - ${ENV_FILE:-.env}
  restart: unless-stopped
  logging: *logging
  # tini as PID 1: forwards SIGTERM to npm/node and reaps zombies.
  init: true
  # Runs as the image's non-root `node` user; it needs no capabilities.
  # Not read_only: Next.js writes .next/cache at runtime.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workespoo}
      POSTGRES_DB: ${POSTGRES_DB:-workespoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the env file}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    oom_score_adj: -800

  web:
    <<: *app
    command: ["npm", "run", "start"]
    environment:
      # Docker sets HOSTNAME to the container id; Next.js binds to it if left alone.
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 1g
    oom_score_adj: -500

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    mem_limit: 768m

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    # Runs as root inside the container (owns /data and /config), but with
    # only the one capability it needs to bind 80 and 443.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    oom_score_adj: -500
    # The ONLY published ports on the host. Docker bypasses ufw for published
    # ports, so never add `ports:` to db, web or worker.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy-data holds the ACME account and certificates. It survives
      # `up`/redeploys; never `docker compose down -v` (see infra/README.md).
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
